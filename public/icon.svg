<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vinylBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1f14" />
      <stop offset="40%" stop-color="#05120c" />
      <stop offset="85%" stop-color="#020805" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="#040906" />
  
  <!-- Outer glowing rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" />
  
  <!-- Vinyl disc surface -->
  <circle cx="256" cy="256" r="226" fill="url(#vinylBg)" />

  <!-- Vinyl grooves (fine concentric rings) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#163824" stroke-width="1" opacity="0.5" />
  <circle cx="256" cy="256" r="192" fill="none" stroke="#0e2618" stroke-width="1.5" opacity="0.6" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="#18422b" stroke-width="1" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-width="1" opacity="0.25" />
  <circle cx="256" cy="256" r="126" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.35" />

  <!-- Center Label Deck -->
  <circle cx="256" cy="256" r="96" fill="#072b1b" stroke="#00ff88" stroke-width="2.5" />
  <circle cx="256" cy="256" r="76" fill="#02150c" stroke="#10b981" stroke-width="1" />

  <!-- Play & Waveform Icon Motif inside Center -->
  <!-- Play triangle with stylized M & equalizer sound wave -->
  <path d="M236 216 L296 256 L236 296 Z" fill="url(#neonGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="12" fill="#00ff88" opacity="0.9" />

  <!-- Spindle hole -->
  <circle cx="256" cy="256" r="7" fill="#000000" stroke="#00ff88" stroke-width="1" />

  <!-- Stylized modern M lettermark at top arc -->
  <path d="M 230 92 L 244 92 L 256 108 L 268 92 L 282 92 L 282 122 L 272 122 L 272 106 L 261 120 L 251 120 L 240 106 L 240 122 L 230 122 Z" fill="#00ff88" filter="url(#glow)" />

  <!-- Subtle turntable light shine -->
  <path d="M 120 120 Q 256 80 392 120" stroke="#00ff88" stroke-width="2" fill="none" opacity="0.25" />
</svg>
